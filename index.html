    <h1>맥플루 — 브랜드에 영향력을 입히는 패션 MCN</h1>
    <p>한국 명품 공급사가 만든 패션 MCN입니다. 부티크 직계약 네트워크, 정품 검수, 국내 물류·보관을 갖춘 인프라 위에서 브랜드와 크리에이터를 광고가 아닌 콘텐츠로 잇습니다.</p>

    <h2>중개하는 세 가지 방식</h2>
    <ul>
      <li><strong>브랜디드 콘텐츠</strong> — 광고가 아닌, 브랜드 톤을 살린 에디토리얼. 시즌 단위 발행, 멀티 플랫폼 동시 송출.</li>
      <li><strong>라이브 커머스</strong> — 콘텐츠에서 구매까지 한 화면. 인스타·틱톡·유튜브 라이브와 macflu.com 연동, 다국가 결제·배송 자동화.</li>
      <li><strong>RS 판매구조</strong> — 광고비 0원, 매출에 따른 수익 쉐어. 위탁판매 기반으로 브랜드 진입 리스크가 없습니다.</li>
    </ul>

    <h2>Brink — 자체 커머스 인프라</h2>
    <p>외부 SaaS가 아닌 맥플루가 직접 개발한 시스템입니다. 입점·재고·주문·결제·배송·정산을 자동화해 브랜드와 셀러를 잇습니다. Shopee, Lazada, TikTok Shop, Amazon, Rakuten, macflu.com으로 동시 유통합니다.</p>

    <h2>크리에이터 지원</h2>
    <p>콘텐츠 가이드·기획, 매니지먼트(분석·일정·계약·정산), 부티크 직계약 자산을 활용한 협찬·콜라보, 촬영 지원까지 시즌 단위로 함께 운영합니다.</p>

    <h2>문의</h2>
    <p>크리에이터 지원 <a href="mailto:cast@macflu.com">cast@macflu.com</a> · 브랜드·광고주 문의 <a href="mailto:brand@macflu.com">brand@macflu.com</a> · 평균 3일 이내 답신.</p>
